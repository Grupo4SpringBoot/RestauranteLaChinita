
spring.application.name=RestauranteLaChinita

# Base de datos
#spring.datasource.url=jdbc:postgresql://localhost:5432/restaurante
spring.datasource.url=${URL}
spring.datasource.username=postgres
#spring.datasource.password=P4$$w0rd
spring.datasource.password=${PASSWORD}

# JWT
#app.jwt.secret=${JWT_SECRET}
app.jwt.secret=clave-secreta-jwt-restaurante-la-chinita
app.jwt.issuer=restaurante-la-chinita
app.jwt.expiration=7200

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Puerto definitivo
server.port=8080

